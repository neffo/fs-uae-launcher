name: Linux-arm64
on:
  push:
    branches:
      - stable-amiga-live
  pull_request:
    branches:
      - stable-amiga-live
jobs:
  Linux_arm64:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Log environment
        run: |
          env

      - name: Install additional tools
        run: >-
          sudo apt install
          dos2unix
          gettext

      # When pyinstaller collects libraries, it seems to ignore libraries that
      # are not found on the host. Example: Qt depends on
      # libxkbcommon-x11.so.0 which is not bundled unless explicitly installed
      # first So we install some dependencies here.

      - name: Install library dependencies
        run: >-
          sudo apt install
          libxcb-glx0
          libxcb-icccm4
          libxcb-image0
          libxcb-keysyms1
          libxcb-randr0
          libxcb-render0
          libxcb-render-util0
          libxcb-shape0
          libxcb-shm0
          libxcb-sync1
          libxcb-util1
          libxcb-xfixes0
          libxcb-xinerama0
          libxcb-xkb1
          libxkbcommon-x11-0

      - name: Debug list libraries
        run: |
          ls /usr/lib/x86_64-linux-gnu

      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install pip and pipenv (not used)
        run: |
          python3 -m pip install pip pipenv

      - name: Install pyinstaller
        run: |
          # pipenv uninstall pyinstaller
          python3 -m pip install pyinstaller

      - name: Update version
        run: |
          fsbuild/version

      - name: Bootstrap
        if: hashFiles('fsbuild/bootstrap') != ''
        run: |
          fsbuild/bootstrap

      - name: Configure
        if: hashFiles('fsbuild/configure') != ''
        run: |
          fsbuild/configure

      - name: Build
        run: |
          fsbuild/build

      - name: Bundle
        run: |
          fsbuild/bundle

      - name: Archive
        run: |
          fsbuild/archive
